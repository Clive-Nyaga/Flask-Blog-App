{% extends "base.html" %}

{% block head %}
<title>Edit Post</title>
{% endblock %}


{% block body %}
<h1>Editing Post</h1>

<hr>
<h2>Edit:</h2>
<form action="/posts/edit/{{post.id}}" method="POST">

    <label for="title">Title:</label>
    <input class="form-control" type="text" name="title" id="title" value="{{ post.title }}" aria-label="Enter Title"
        required>
    <br>

    <!--<label for="title">Title:</label><br>
                <input type="text" id="title" name="title" required><br><br>-->

    <label for="author">Author:</label>
    <input class="form-control" type="text" name="author" id="author" value="{{ post.author }}"
        aria-label="Enter Author">
    <br>


    <!--<label for="author">Author:</label><br>
                <input type="text" id="author" name="author"><br><br>-->

    <label for="content">Content:</label>
    <!--<div class="form-group">-->
    <!--<label for="exampleFormControlTextarea1">Content:</label>-->
    <textarea class="form-control" name="content" id="content" placeholder="Enter Content" aria-label="Enter Content"
        rows="3">{{ post.content }}</textarea>
    <br>
    <!--</div>-->

    <!--<label for="content">Content:</label><br>
    <textarea id="content" name="content" rows="4" cols="50" required></textarea><br><br>-->

    <input type="submit" value="Save">
</form>

                <input type="submit" value="Save">

<hr>


{% endblock %}
